name: Django CI

on:
  push:
    branches: [ "main","MengF-W-CI" ]
  pull_request:
    branches: [ "main","MengF-W-CI" ]

defaults:
 run:
  working-directory: ./aerospace_and_aviation_science_data/aerospace_and_aviation_science_data

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12,3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test nasaApp
  
  deploy:
  
    runs-on: ubuntu-latest
    needs: [build]
    steps:
     - name: Set Up Deploy
       working-directory: .
       run: echo 'ready to deploy'
